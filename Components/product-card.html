<!--
  Component: product-card
  Purpose: A single product card — bordered tile with image, name, two-line description, price,
           and a whole-card link. The atomic unit that product-grid repeats.
  BRD mapping: WK-S6 / MO-S7 (single-product use)
  Required inputs: [[PRODUCT_IMAGE_URL]], [[PRODUCT_TITLE]], [[PRODUCT_URL]]
  Optional inputs: [[PRODUCT_DESC]] (two short benefit lines, use <br> between; omit for none),
                   [[PRODUCT_PRICE]], [[CARD_BORDER_COLOR]] (default #ececec), [[CARD_BG]]
                   (default #ffffff), [[CARD_RADIUS]] (default 12px), [[IMAGE_RADIUS]] (default 8px),
                   [[META_SIZE]] (default 13px), [[SMALL_SIZE]] (default 12px),
                   [[BODY_SIZE]] (default 15px)
  Fallback behavior: never fabricate a product. If real product data is unavailable, STOP and report
                     (per Product Sourcing Rules, CLAUDE.md §5). [[PRODUCT_DESC]]/[[PRODUCT_PRICE]]
                     may be omitted; the card still renders.
  Dependencies: shared .prod-name / .prod-sub (equal-height) from base-head. product-grid.html mirrors
                this markup inline for multi-product rows (independence rule, Components/README).
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="dm-bg" style="border:1px solid [[CARD_BORDER_COLOR]]; border-radius:[[CARD_RADIUS]]; background:[[CARD_BG]];">
  <tr>
    <td style="padding:12px 12px 16px 12px;">
      <a href="[[PRODUCT_URL]]" style="text-decoration:none;">
        <img src="[[PRODUCT_IMAGE_URL]]" alt="[[PRODUCT_TITLE]]" width="100%" style="display:block; width:100%; height:auto; margin-bottom:12px; border-radius:[[IMAGE_RADIUS]];" />
        <p class="prod-name dm-text" style="margin:0 0 3px 0; font-family:[[FONT_STACK]]; font-size:[[META_SIZE]]; font-weight:700; line-height:1.4; color:[[TEXT_COLOR]];">[[PRODUCT_TITLE]]</p>
        <p class="prod-sub" style="margin:0 0 8px 0; font-family:[[FONT_STACK]]; font-size:[[SMALL_SIZE]]; line-height:1.45; color:[[MUTED_TEXT_COLOR]];">[[PRODUCT_DESC]]</p>
        <p class="dm-text" style="margin:0; font-family:[[FONT_STACK]]; font-size:[[BODY_SIZE]]; font-weight:700; color:[[TEXT_COLOR]];">[[PRODUCT_PRICE]]</p>
      </a>
    </td>
  </tr>
</table>
