<!--
  Component: header
  Purpose: Brand logo bar at the top of the email, with light/dark-mode logo swap.
  BRD mapping: WK-S3 / MO-S3
  Required inputs: [[LOGO_URL]], [[LOGO_ALT]]
  Optional inputs: [[LOGO_DARK_URL]] (dark-mode logo), [[LOGO_WIDTH]] (default 220),
                   [[HEADER_BG]] (default [[BODY_BG]])
  Fallback behavior: if [[LOGO_DARK_URL]] is absent, generation sets it equal to [[LOGO_URL]]
                     (the same logo shows in both modes). If [[LOGO_URL]] is absent, STOP and
                     request it — never ship a placeholder logo.
  Dependencies: none. Uses shared .dm-logo-light / .dm-logo-dark classes from base-head.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="dm-bg" style="background:[[HEADER_BG]];">
  <tr>
    <td align="center" style="padding:24px 40px;">
      <img src="[[LOGO_URL]]" alt="[[LOGO_ALT]]" width="[[LOGO_WIDTH]]" class="dm-logo-light" style="display:block; width:[[LOGO_WIDTH]]px; max-width:100%; height:auto;" />
      <img src="[[LOGO_DARK_URL]]" alt="[[LOGO_ALT]]" width="[[LOGO_WIDTH]]" class="dm-logo-dark" style="display:none; width:[[LOGO_WIDTH]]px; max-width:100%; height:auto;" />
    </td>
  </tr>
</table>
