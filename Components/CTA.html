<!--
  Component: CTA
  Purpose: Primary bulletproof call-to-action button (Outlook VML + standard anchor).
  BRD mapping: WK-S5 / MO-S6
  Required inputs: [[CTA_LABEL]], [[CTA_URL]]
  Optional inputs: [[BUTTON_BG]] (default [[ACCENT_COLOR]]), [[BUTTON_TEXT_COLOR]] (default #ffffff),
                   [[BUTTON_RADIUS]] (default 28px), [[BUTTON_ARCSIZE]] (VML equivalent of radius,
                   default 50%), [[BUTTON_WIDTH]] (VML fixed width, sized to the label — default 260px),
                   [[BODY_SIZE]] (default 15px)
  Fallback behavior: exactly one PRIMARY CTA per key section (CTA hierarchy — see CTA-secondary.html
                     for supporting outline/text links). If [[CTA_URL]] or [[CTA_LABEL]] is absent,
                     STOP and request it — never invent a link.
  Dependencies: none. Uses shared .tap class from base-head for a 44px tap target on mobile.
  Note: [[BUTTON_WIDTH]] must match the non-MSO padding button's rendered width so Outlook and other
        clients agree. Generation sets it from the label length; long labels widen it rather than clip.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="dm-bg" style="background:[[BODY_BG]];">
  <tr>
    <td align="center" style="padding:8px 28px 32px 28px;">
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="[[CTA_URL]]" style="height:48px;v-text-anchor:middle;width:[[BUTTON_WIDTH]];" arcsize="[[BUTTON_ARCSIZE]]" fillcolor="[[BUTTON_BG]]" strokecolor="[[BUTTON_BG]]">
        <w:anchorlock/>
        <center style="color:[[BUTTON_TEXT_COLOR]];font-family:sans-serif;font-size:[[BODY_SIZE]];font-weight:bold;">[[CTA_LABEL]]</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-- -->
      <a href="[[CTA_URL]]" class="tap" style="background:[[BUTTON_BG]]; border-radius:[[BUTTON_RADIUS]]; color:[[BUTTON_TEXT_COLOR]]; display:inline-block; font-family:[[FONT_STACK]]; font-size:[[BODY_SIZE]]; font-weight:bold; line-height:48px; text-align:center; text-decoration:none; padding:0 32px; letter-spacing:0.6px;">[[CTA_LABEL]]</a>
      <!--<![endif]-->
    </td>
  </tr>
</table>
