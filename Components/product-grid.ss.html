<!--
  Component: product-grid.ss (SS Weekly visual-system override)
  Purpose: SS's own approved product card — white bordered card (12px radius), image,
           title, one-line description, and the price as plain accent-colour text (NOT a
           filled button). Hybrid stacking (.col-2 inline-block + MSO table fallback), as
           shipped in SS-2026-W32/W36/W38. Loaded INSTEAD of the generic product-grid.html
           by renderer.js's brandFile() when brand.code === "SS" (CLAUDE.md §6.6/§6.20).
           The generic card's boxed BUTTON_BG price and top-right brandmark corner icon are
           RDD's approved treatment (RDD-2026-W31), not SS's — genuinely different card
           anatomy, not a colour swap. Card markup mirrors product-card.html's structural
           standard (fixed-height regions, THREE sibling anchors, never a <table> in an <a>).
  Required inputs (per card, suffix _1 = left, _2 = right): [[PRODUCT_n_IMAGE_URL]],
                   [[PRODUCT_n_TITLE]], [[PRODUCT_n_URL]]
  Optional inputs: [[PRODUCT_n_DESC]], [[PRODUCT_n_PRICE]], [[PRODUCT_n_IMAGE_W]]/[[PRODUCT_n_IMAGE_H]]
  Fallback behavior: never fabricate products, prices, or images — CLAUDE.md §5/§5.1.
  Dependencies: base-head.html's `.col-2` responsive rule (max-width:100% on mobile) and
                shared `.mp`/`.pimg`/`.pnc`/`.pdc` height-reset classes.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="dm-bg" bgcolor="[[BODY_BG]]" style="background:[[BODY_BG]];"><tr><td style="padding:16px 18px 0 18px;">
<div style="font-size:0; text-align:center;">

<div class="col-2" style="display:inline-block; width:100%; max-width:280px; box-sizing:border-box; vertical-align:top; padding:0 6px 16px 6px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="dm-bg" bgcolor="[[CARD_BG]]" style="border:1px solid [[CARD_BORDER_COLOR]]; border-radius:12px; background:[[CARD_BG]]; height:100%;">
    <tr><td class="pimg" align="center" valign="middle" height="188" style="height:188px; padding:16px 14px 6px 14px;" bgcolor="[[CARD_BG]]"><a href="[[PRODUCT_1_URL]]" target="_blank" style="text-decoration:none;"><img src="[[PRODUCT_1_IMAGE_URL]]" alt="[[PRODUCT_1_TITLE]]" width="120" height="158" style="display:block; width:auto; height:auto; max-width:120px; max-height:158px; border:0; line-height:100%; border-radius:6px; margin:0 auto;" /></a></td></tr>
    <tr><td class="pnc" align="center" valign="top" height="40" style="height:40px; padding:2px 12px 0 12px;" bgcolor="[[CARD_BG]]"><a href="[[PRODUCT_1_URL]]" target="_blank" style="text-decoration:none;"><p class="dm-text" style="margin:0; font-family:[[FONT_STACK]]; font-size:[[META_SIZE]]; font-weight:700; line-height:1.3; color:[[TEXT_COLOR]]; text-align:center;">[[PRODUCT_1_TITLE]]</p></a></td></tr>
    <tr><td class="pdc" align="center" valign="top" height="32" style="height:32px; padding:3px 12px 0 12px;" bgcolor="[[CARD_BG]]"><p class="dm-sub" style="margin:0; font-family:[[FONT_STACK]]; font-size:[[SMALL_SIZE]]; line-height:1.4; color:[[MUTED_TEXT_COLOR]]; text-align:center;">[[PRODUCT_1_DESC]]</p></td></tr>
    <tr><td class="ppc" align="center" valign="bottom" height="30" style="height:30px; padding:8px 12px 16px 12px;" bgcolor="[[CARD_BG]]"><a href="[[PRODUCT_1_URL]]" target="_blank" style="text-decoration:none;"><p style="margin:0; font-family:[[FONT_STACK]]; font-size:17px; font-weight:800; color:[[ACCENT_COLOR]]; text-align:center;">[[PRODUCT_1_PRICE]]</p></a></td></tr>
  </table>
</div>
